<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>文件星系 —— YouTube 20.44.36 官方 vs 修改版</title>
<style>
  body{margin:0;background:#04060c;color:#c9d4e0;font-family:"Microsoft YaHei",system-ui;overflow:hidden}
  #hud{position:fixed;top:14px;left:16px;z-index:10}
  #hud h1{font-size:16px;margin:0 0 4px;color:#dbe7f3;font-weight:600}
  #hud .sub{font-size:11px;color:#7b8ea1}
  #legend{position:fixed;bottom:14px;left:16px;z-index:10;font-size:12px;background:rgba(10,16,24,.72);
          padding:10px 14px;border-radius:8px;border:1px solid #1d2a3a}
  #legend b{color:#8fa8c0;font-weight:600}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  #filters{position:fixed;top:14px;right:16px;z-index:10;background:rgba(10,16,24,.72);
           padding:10px 14px;border-radius:8px;border:1px solid #1d2a3a;font-size:12px}
  #filters label{display:block;margin:3px 0;cursor:pointer;color:#a9bccf}
  #filters input{vertical-align:middle}
  #search{margin-top:6px;width:180px;background:#0d1520;border:1px solid #24354a;color:#c9d4e0;
          padding:4px 8px;border-radius:4px;font-size:12px}
  #card{position:fixed;top:90px;right:16px;width:300px;z-index:11;background:rgba(10,16,24,.9);
        border:1px solid #24354a;border-radius:8px;padding:12px 14px;font-size:12px;display:none}
  #card .path{font-family:Consolas,monospace;color:#9fe08f;word-break:break-all}
  #card .row{margin:4px 0;color:#a9bccf}
  #stats{position:fixed;bottom:14px;right:16px;z-index:10;font-size:12px;color:#7b8ea1;text-align:right}
</style>
</head>
<body>
<div id="hud"><h1>文件星系 · YouTube 20.44.36</h1>
  <div class="sub">每颗星 = 一个真实文件 · 拖拽旋转 · 滚轮缩放 · 悬停查看 · 点击聚焦</div></div>
<div id="filters">
  <b style="color:#8fa8c0">状态过滤</b>
  <label><input type=checkbox id=f-same checked> 一致 (8100)</label>
  <label><input type=checkbox id=f-mod checked> 被修改 (4)</label>
  <label><input type=checkbox id=f-del checked> 被裁剪 (7890)</label>
  <input id=search placeholder="搜索路径…">
</div>
<div id="card"></div>
<div id="legend">
  <span class="dot" style="background:#4a7dad"></span><b>与官方一致</b>&nbsp;&nbsp;
  <span class="dot" style="background:#ef4444;box-shadow:0 0 6px #ef4444"></span><b>被修改(4)</b>&nbsp;&nbsp;
  <span class="dot" style="background:#253244"></span><b>被裁剪(不在修改版)</b>
</div>
<div id="stats"></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const DATA = __DATA__;

// ---------- 布局: 数据驱动, 簇 = 路径前两级(或一级) ----------
function clusterKey(p){
  const parts = p.split('/');
  return parts.length > 2 ? parts.slice(0,2).join('/') : (parts[0] || '(root)');
}
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return (h>>>0)/4294967295; }

const groups = {};
for (const f of DATA.files){
  const k = clusterKey(f.p);
  (groups[k] = groups[k] || []).push(f);
}
// 簇按数量排环形
const keys = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
const RING = Math.max(260, Math.sqrt(keys.length)*60);
const clusterCenter = {};
keys.forEach((k,i)=>{
  const a = i/keys.length*Math.PI*2;
  const r = 90 + 130*Math.sqrt(groups[k].length / DATA.files.length);
  clusterCenter[k] = [Math.cos(a)*r, (hash(k)-0.5)*90, Math.sin(a)*r];
});

// 点属性
const N = DATA.files.length;
const pos = new Float32Array(N*3), col = new Float32Array(N*3), siz = new Float32Array(N), flag = new Float32Array(N);
const meta = [];
const COLOR = {same:new THREE.Color('#4a7dad'), mod:new THREE.Color('#ef4444'), del:new THREE.Color('#253244'), add:new THREE.Color('#22c55e')};
DATA.files.forEach((f,i)=>{
  const k = clusterKey(f.p), c = clusterCenter[k], h = hash(f.p), h2 = hash(f.p+'|y');
  const spread = 14*Math.sqrt(groups[k].length);
  const x = c[0] + (h-0.5)*2*spread;
  const y = c[1] + (h2-0.5)*2*spread*0.5;
  const z = c[2] + (hash(f.p+'|z')-0.5)*2*spread;
  pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
  const base = COLOR[f.st] || COLOR.same;
  let brightness = f.st==='mod' ? 1.6 : (f.st==='del' ? 0.55 : 0.75 + 0.5*Math.min(1, f.s/1048576));
  col[i*3]=base.r*brightness; col[i*3+1]=base.g*brightness; col[i*3+2]=base.b*brightness;
  siz[i] = f.st==='mod' ? 5.5 : (f.st==='del' ? 2.2 : 1.6 + 2.2*Math.min(1, f.s/2097152));
  flag[i] = f.st==='mod' ? 1 : 0;
  meta.push({p:f.p, s:f.s, st:f.st, k});
});

// 渲染器
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04060c, 0.00055);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 4000);
camera.position.set(240, 150, 320);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
geo.setAttribute('color', new THREE.BufferAttribute(col,3));
geo.setAttribute('aSize', new THREE.BufferAttribute(siz,1));
geo.setAttribute('aFlag', new THREE.BufferAttribute(flag,1));
const mat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{uTime:{value:0}},
  vertexShader:`
    attribute float aSize; attribute float aFlag; attribute vec3 color;
    uniform float uTime; varying vec3 vColor; varying float vFlag;
    void main(){
      vColor=color; vFlag=aFlag;
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      float pulse = aFlag>0.5 ? 1.0+0.45*sin(uTime*3.0+position.x) : 1.0;
      gl_PointSize = aSize * pulse * (240.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    varying vec3 vColor; varying float vFlag;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      if(d>0.5) discard;
      float a = smoothstep(0.5, 0.08, d);
      gl_FragColor = vec4(vColor, a);
    }`
});
scene.add(new THREE.Points(geo, mat));

// 星尘背景
{
  const n=900, p=new Float32Array(n*3);
  for(let i=0;i<n;i++){ p[i*3]=(Math.random()-0.5)*2400; p[i*3+1]=(Math.random()-0.5)*1400; p[i*3+2]=(Math.random()-0.5)*2400; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0x27354a, size:1.6, transparent:true, opacity:0.55})));
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.85, 0.5, 0.12);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// 交互
const ray = new THREE.Raycaster(); ray.params.Points.threshold = 4.5;
const mouse = new THREE.Vector2(); let hovered = -1;
const card = document.getElementById('card');
renderer.domElement.addEventListener('pointermove', e=>{
  mouse.x = (e.clientX/innerWidth)*2-1; mouse.y = -(e.clientY/innerHeight)*2+1;
});
const STATUS_CN = {same:'与官方一致', mod:'被修改', del:'被裁剪(不在修改版)', add:'修改版新增'};
function fmt(s){ return s>=1048576 ? (s/1048576).toFixed(2)+' MB' : s>=1024 ? (s/1024).toFixed(1)+' KB' : s+' B'; }
renderer.domElement.addEventListener('click', ()=>{
  if(hovered>=0){
    const m = meta[hovered];
    card.style.display='block';
    card.innerHTML = `<div class='path'>${m.p.replace(/</g,'&lt;')}</div>
      <div class='row'>大小: ${fmt(m.s)}</div>
      <div class='row'>状态: ${STATUS_CN[m.st]||m.st}</div>
      <div class='row'>簇: ${m.k.replace(/</g,'&lt;')}</div>`;
  } else card.style.display='none';
});

// 过滤与搜索
const show = {same:true, mod:true, del:true};
let query = '';
function applyFilter(){
  for(let i=0;i<N;i++){
    const m = meta[i];
    const vis = show[m.st] && (!query || m.p.toLowerCase().includes(query));
    siz[i] = vis ? (m.st==='mod' ? 5.5 : (m.st==='del' ? 2.2 : 1.6 + 2.2*Math.min(1, m.s/2097152))) : 0;
  }
  geo.attributes.aSize.needsUpdate = true;
  const c = {same:0,mod:0,del:0};
  meta.forEach((m,i)=>{ if(siz[i]>0) c[m.st]++; });
  document.getElementById('stats').textContent = `可见: ${c.same+c.mod+c.del} / ${N}  (一致 ${c.same} · 改 ${c.mod} · 删 ${c.del})`;
}
['same','mod','del'].forEach(k=>{
  document.getElementById('f-'+k).addEventListener('change', e=>{ show[k]=e.target.checked; applyFilter(); });
});
document.getElementById('search').addEventListener('input', e=>{ query=e.target.value.toLowerCase(); applyFilter(); });
applyFilter();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  mat.uniforms.uTime.value = clock.getElapsedTime();
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(scene.children.find(o=>o.isPoints), {threshold:4.5})[0];
  hovered = hit ? hit.index : -1;
  renderer.domElement.style.cursor = hovered>=0 ? 'pointer' : 'default';
  controls.update();
  composer.render();
}
tick();
</script>
</body>
</html>
